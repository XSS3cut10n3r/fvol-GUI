  <!--
    The "fastvol" wordmark: hand-built upright monoline lowercase, stroke 8 on a 40-unit x-height.
    Bowls are rounded rectangles with a centreline radius of 10 (8 in the s), terminals are cut
    square, and the v is a filled outline whose diagonals match the stems. No font is needed.
    Hand-written source for light backgrounds: "fast" in copper, "vol" in ink (#1f2328).
    docs/assets/build.py derives wordmark-dark.svg and the logo lockups from it.
    Baseline y=100, x-height y=60, ascender y=37 (t: y=44).
  -->
