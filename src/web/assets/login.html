<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>rsvol — access token</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="/assets/theme.js"></script>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body class="login">
<main class="dialog login-box">
  <div class="card-h"><h3>rsvol · locked</h3></div>
  <form class="card-b openbox" method="post" action="/login">
    <p class="prose flush">This server gives access to a memory image. Open the URL printed by <code>vol serve</code>, or paste its access token here.</p>
    {{FAILED}}
    <div class="row">
      <input class="input" name="token" type="password" autocomplete="off" spellcheck="false" placeholder="access token" aria-label="Access token" autofocus required>
      <button class="btn primary" type="submit">Unlock</button>
    </div>
  </form>
</main>
</body>
</html>
